<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kotoba Memory</title><style>
/* Konsep: langit malam yang tenang. Bulan emas sebagai aksen, bintang sebagai progres.
   Semua warna ada di token. Tema bawaan "semesta" (gelap), plus mode polos terang/gelap/sistem. */
:root{--bg:#070a1c;--sky1:#060917;--sky2:#0b1030;--sky3:#17103a;--neb1:rgba(120,110,255,.34);--neb2:rgba(45,212,191,.18);
--fg:#e8ebff;--mu:#a0a8d0;--cd:rgba(15,20,50,.6);--cd2:rgba(31,40,86,.6);--bd:rgba(148,163,255,.22);
--ac:#f2d489;--acf:#1c1604;--ok2:#67e8f9;--ok:#6ee7b7;--hd:#fbbf24;--bad:#fb7185;
--starlit:#c7d2fe;--stargold:#fcd34d;--staroff:rgba(165,180,255,.5);--cline:rgba(190,205,255,.85);
--moonlit:#f4eed7;--moondark:#1a2047;--moonc:rgba(120,110,90,.28);--glow:rgba(244,238,215,.38);
--nav:rgba(10,14,38,.82);--ac2:#e0a85a;--shd:0 10px 30px rgba(0,0,0,.30);--tbg:#e8ebff;--tfg:#070a1c;--er:#fb7185;--dp:#fbbf24;
--fd:"Instrument Serif",Georgia,"Times New Roman",serif;
--fb:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--fj:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
color-scheme:dark}
:root[data-theme="light"]{--bg:#f6f4ee;--fg:#1d1c2a;--mu:#5f6078;--cd:#fff;--cd2:#f0eee6;--bd:#dcd8cc;--ac:#7a4a0a;--acf:#fff;--ok2:#0e7490;--ok:#047857;--hd:#b45309;--bad:#be123c;--starlit:#4f46e5;--stargold:#b45309;--staroff:rgba(80,80,120,.2);--cline:rgba(80,80,140,.4);--moonlit:#e9dfb8;--moondark:#cfd3e6;--moonc:rgba(120,110,90,.25);--glow:rgba(0,0,0,0);--nav:rgba(255,255,255,.88);--ac2:#c2760f;--shd:0 6px 20px rgba(70,55,20,.10);--tbg:#1d1c2a;--tfg:#fff;--er:#be123c;--dp:#b45309;color-scheme:light}
@media (prefers-color-scheme:light){:root[data-theme="system"]{--bg:#f6f4ee;--fg:#1d1c2a;--mu:#5f6078;--cd:#fff;--cd2:#f0eee6;--bd:#dcd8cc;--ac:#7a4a0a;--acf:#fff;--ok2:#0e7490;--ok:#047857;--hd:#b45309;--bad:#be123c;--starlit:#4f46e5;--stargold:#b45309;--staroff:rgba(80,80,120,.2);--cline:rgba(80,80,140,.4);--moonlit:#e9dfb8;--moondark:#cfd3e6;--moonc:rgba(120,110,90,.25);--glow:rgba(0,0,0,0);--nav:rgba(255,255,255,.88);--ac2:#c2760f;--shd:0 6px 20px rgba(70,55,20,.10);--tbg:#1d1c2a;--tfg:#fff;--er:#be123c;--dp:#b45309;color-scheme:light}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--fb);-webkit-text-size-adjust:100%}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
:root[data-theme="system"] #sky,:root[data-theme="light"] #sky,:root[data-theme="dark"] #sky{display:none}

#sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
background:radial-gradient(70% 45% at 85% 8%,var(--neb1),transparent 70%),radial-gradient(60% 40% at 5% 90%,var(--neb2),transparent 70%),linear-gradient(180deg,var(--sky1),var(--sky2) 55%,var(--sky3))}
#sky .st{position:absolute;left:0;top:0;border-radius:50%;background:transparent}
#sky .s1{width:1px;height:1px}
#sky .s2{width:2px;height:2px;animation:tw 4s ease-in-out infinite alternate}
#sky .s3{width:2px;height:2px;animation:tw 6s ease-in-out -2s infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
html.calm #sky .st{animation:none}
html.lite #sky .st{animation:none}
@media (prefers-reduced-motion:reduce){#sky .st{animation:none}}
#sky .con{position:absolute;opacity:.85;filter:drop-shadow(0 0 5px var(--cline))}
#sky .con svg{display:block;width:100%;height:auto}
#sky .c1{right:2%;top:33%;width:min(46vw,230px)}
#sky .c2{left:1%;bottom:15%;width:min(36vw,170px)}
#sky .c3{left:4%;top:47%;width:min(30vw,140px)}
#skymoon{position:absolute;right:14px;top:14px;line-height:0;filter:drop-shadow(0 0 14px var(--glow))}

#app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:14px 16px 96px}
body.full #app{padding-bottom:170px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--nav);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:13px 2px 11px;font:inherit;font-size:12px;position:relative;cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--ac);border-radius:0 0 2px 2px}

h1,h2{font-family:var(--fd);font-weight:400;text-wrap:balance}
h1{margin:2px 0 4px;font-size:36px;line-height:1.08}
h2{margin:6px 0 12px;font-size:30px;line-height:1.1}
h3{margin:18px 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);font-weight:600}
.hero{padding:6px 76px 4px 0}
.moonl{font-size:13px;color:var(--mu)}
.m{color:var(--mu);font-size:13px}
.ct{font-weight:600;margin:0 0 2px}
.cs{color:var(--mu);font-size:13px;margin:0 0 8px}

.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
.lk{cursor:pointer}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g .c{margin:0}
.n{font:400 36px/1.05 var(--fd);font-variant-numeric:tabular-nums}
.n small{font:400 14px var(--fb);color:var(--mu)}
.r{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
.r>*{min-width:0}
.r:last-child{border-bottom:0}
.goal{display:flex;gap:16px;align-items:center}
.goal .gm{flex:0 0 auto;line-height:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:3px 10px;border:1px solid var(--bd);border-radius:999px;color:var(--fg)}
.chip svg{color:var(--ac)}

button{font-family:inherit}
.b{display:block;width:100%;border:0;border-radius:14px;padding:15px;margin:8px 0;background:var(--ac);color:var(--acf);font:700 16px var(--fb);cursor:pointer}
.b.s{background:var(--cd2);color:var(--fg);border:1px solid var(--bd)}
.b.dn{background:var(--bad);color:var(--acf)}
.b.sm{display:inline-block;width:auto;padding:9px 14px;font-size:14px;margin:4px 6px 4px 0}
.b .bn{display:inline-block;margin-left:6px;padding:0 9px;border-radius:999px;background:var(--acf);color:var(--ac);font-size:13px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--cd2);color:var(--fg);font:inherit;margin:4px 0}
textarea{min-height:150px}
.ck{display:flex;gap:10px;align-items:center;margin:12px 0}
.ck input{width:20px;height:20px;margin:0;accent-color:var(--ac)}
.tag{font-size:12px;padding:2px 8px;border-radius:9px;border:1px solid var(--bd);color:var(--mu)}
.er{color:var(--er)}.dp{color:var(--dp)}.sc{overflow-x:auto}
#t{position:fixed;left:16px;right:16px;bottom:88px;max-width:608px;margin:0 auto;background:var(--tbg);color:var(--tfg);padding:11px 14px;border-radius:12px;display:none;z-index:9}
.ic{vertical-align:-3px}

.tabs{display:flex;gap:6px;overflow-x:auto;margin:4px 0 10px;padding-bottom:2px}
.tabs button{flex:0 0 auto;border:1px solid var(--bd);background:var(--cd);color:var(--mu);padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:999px;overflow:hidden;float:right}
.seg button{border:0;background:none;color:var(--mu);padding:4px 12px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--acf);font-weight:700}

.top{display:flex;align-items:center;gap:12px;margin:2px 0 6px}
.pg{flex:1;height:6px;border-radius:3px;background:var(--staroff);overflow:hidden}
.pg i{display:block;height:100%;border-radius:3px;background:var(--ac)}
.tools{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.ib{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--cd);color:var(--fg);padding:8px 12px;border-radius:12px;font-size:14px;cursor:pointer}
.ib:disabled{opacity:.4;cursor:default}
.fc{position:relative;text-align:center;padding:34px 16px 26px;min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.jp{font:600 46px/1.2 var(--fj);word-break:break-word}
.mean{font:400 32px/1.25 var(--fd);word-break:break-word}
.ro{font-size:18px;color:var(--mu);letter-spacing:.02em}
.sep{height:1px;background:var(--bd);margin:6px 28px}
.spk{position:absolute;right:8px;top:8px;border:0;background:none;color:var(--mu);padding:10px;border-radius:12px;cursor:pointer}
.act{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--nav);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.act>div{max-width:608px;margin:0 auto}
.act .b{margin:0}
.rt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rb{border:1px solid var(--bd);border-bottom-width:3px;background:var(--cd2);color:var(--fg);border-radius:14px;padding:10px 2px;display:flex;flex-direction:column;gap:2px;align-items:center;cursor:pointer}
.rb b{font-size:15px}
.rb small{font-size:11px;color:var(--mu)}
.r-lupa{border-bottom-color:var(--bad)}.r-sulit{border-bottom-color:var(--hd)}.r-ingat{border-bottom-color:var(--ok)}.r-mudah{border-bottom-color:var(--ok2)}
.op{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);color:var(--fg);font-size:17px;cursor:pointer}
.op.ok{border-color:var(--ok);box-shadow:inset 5px 0 0 var(--ok)}
.op.no{border-color:var(--bad);box-shadow:inset 5px 0 0 var(--bad)}

.ch{display:block;width:100%;height:auto;overflow:visible}
.tx{font-size:9px;fill:var(--mu);font-family:var(--fb);font-variant-numeric:tabular-nums}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mu);margin-top:8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.stk{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--staroff)}
.stk i{display:block;height:100%}
.hb{display:grid;grid-template-columns:78px 1fr 70px;gap:8px;align-items:center;padding:5px 0;font-size:14px}
.hb .hl{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .ht{height:10px;border-radius:5px;background:var(--staroff);overflow:hidden}
.hb .ht i{display:block;height:100%;border-radius:5px}
.hb .hv{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.tbw{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tb th{color:var(--mu);font-weight:500;text-align:right;padding:6px 4px}
.tb td{padding:8px 4px;text-align:right;border-top:1px solid var(--bd)}
.tb td:first-child,.tb th:first-child{text-align:left}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cg .c{margin:0;padding:10px;text-align:center}
.cg svg{display:block;width:100%;max-width:150px;height:auto;margin:0 auto 6px}
.big{font-size:34px;text-align:center;padding:36px 8px;word-break:break-word}
.bar{height:8px;border-radius:4px;background:var(--ac);min-width:2px}
body.full #skymoon{display:none}

#mw{position:absolute;left:-30%;top:22%;width:160%;height:150px;transform:rotate(-26deg);filter:blur(10px);opacity:.9;
background:linear-gradient(180deg,transparent,rgba(170,185,255,.16) 35%,rgba(235,220,255,.24) 50%,rgba(170,185,255,.16) 65%,transparent)}
#mw::after{content:"";position:absolute;inset:30% 8%;background:radial-gradient(40% 50% at 30% 50%,rgba(255,236,190,.22),transparent),radial-gradient(35% 45% at 72% 50%,rgba(190,170,255,.2),transparent)}
#planet{position:absolute;right:92px;top:22px;width:46px;height:35px;line-height:0;opacity:.92;filter:drop-shadow(0 0 10px rgba(242,212,137,.25))}
body.full #planet{opacity:.5}

/* ---- mini, catatan, latihan ---- */
.mini svg{display:block;width:100%;height:auto}
.note{margin-top:8px;padding:8px 12px;border-radius:12px;background:var(--cd2);border:1px solid var(--bd);font-size:14px;color:var(--fg);text-align:left}
.ti{font-size:22px;text-align:center;padding:14px;margin:6px 0}
.res{font-weight:700;font-size:18px}.res.ok{color:var(--ok)}.res.no{color:var(--bad)}
.mtg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mtg>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.mt{border:1px solid var(--bd);background:var(--cd);color:var(--fg);border-radius:14px;padding:12px 8px;min-height:62px;font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;word-break:break-word}
.mt .jj{font:600 20px var(--fj)}.mt small{color:var(--mu);font-size:12px}
.mt.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.mt.ok{border-color:var(--ok);opacity:.35;pointer-events:none}
.mt.no{border-color:var(--bad);background:rgba(251,113,133,.25)}
.thm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.thm button{height:62px;border-radius:14px;border:2px solid var(--bd);cursor:pointer;display:flex;align-items:flex-end;padding:6px;text-align:left}
.thm button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.thm span{background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px}
/* ---- tema latar ---- */
#fx,#aur{display:none}
#fx{position:absolute;inset:0}
#fx i{position:absolute;left:var(--x);top:var(--y)}
:root[data-theme="aurora"] #aur,:root[data-theme="sakura"] #fx,:root[data-theme="ocean"] #fx,:root[data-theme="forest"] #fx{display:block}
:root[data-theme="sakura"] #sky .st,:root[data-theme="ocean"] #sky .st,:root[data-theme="sakura"] #mw,:root[data-theme="ocean"] #mw,:root[data-theme="aurora"] #mw,:root[data-theme="forest"] #mw,:root[data-theme="sakura"] #planet,:root[data-theme="ocean"] #planet,:root[data-theme="aurora"] #planet,:root[data-theme="forest"] #planet,:root[data-theme="sakura"] #skycon,:root[data-theme="ocean"] #skycon{display:none}
#aur{position:absolute;left:-25%;right:-25%;top:3%;height:44%;filter:blur(24px);opacity:.8;transform:skewY(-8deg);animation:aur 16s ease-in-out infinite alternate;
background:linear-gradient(100deg,transparent 8%,rgba(52,211,153,.6) 28%,rgba(45,212,191,.4) 46%,rgba(139,92,246,.5) 66%,transparent 88%)}
#aur::after{content:"";position:absolute;left:10%;right:10%;top:30%;bottom:-10%;background:linear-gradient(80deg,transparent,rgba(110,231,183,.45) 40%,rgba(167,139,250,.4) 70%,transparent);filter:blur(10px)}
@keyframes aur{from{transform:skewY(-8deg) translateX(-7%)}to{transform:skewY(-3deg) translateX(7%)}}
:root[data-theme="sakura"] #fx i{top:-5vh;width:11px;height:8px;border-radius:70% 0 70% 0;background:#ffc2d6;opacity:.85;animation:fall var(--d) linear var(--l) infinite}
@keyframes fall{from{transform:translate(0,0) rotate(0)}to{transform:translate(70px,112vh) rotate(420deg)}}
:root[data-theme="ocean"] #fx i{top:auto;bottom:-6vh;width:var(--s);height:var(--s);border-radius:50%;border:1px solid rgba(200,242,255,.7);background:rgba(200,242,255,.08);animation:rise var(--d) linear var(--l) infinite}
@keyframes rise{from{transform:translate(0,0)}to{transform:translate(20px,-112vh)}}
:root[data-theme="forest"] #fx i{width:4px;height:4px;border-radius:50%;background:#eaff9c;box-shadow:0 0 9px 4px rgba(225,255,140,.6);animation:fly var(--d) ease-in-out var(--l) infinite alternate}
@keyframes fly{from{transform:translate(0,0);opacity:.15}to{transform:translate(34px,-46px);opacity:1}}
html.calm #fx i,html.calm #aur{animation:none}
html.lite #fx i,html.lite #aur{animation:none}
@media (prefers-reduced-motion:reduce){#fx i,#aur{animation:none}}
:root[data-theme="aurora"]{--ac2:#3dd6c4;--bg:#05161d;--sky1:#030f16;--sky2:#06262f;--sky3:#0a1c38;--neb1:rgba(52,211,153,.25);--neb2:rgba(139,92,246,.25);--fg:#e8fff7;--mu:#a3cfc3;--cd:rgba(6,34,42,.55);--cd2:rgba(14,66,70,.6);--bd:rgba(120,235,200,.28);--ac:#7ef0c0;--acf:#03211a;--starlit:#c4f8e8;--stargold:#fde68a;--staroff:rgba(150,240,215,.5);--cline:rgba(180,255,235,.85);--nav:rgba(4,20,27,.94);--tbg:#e8fff7;--tfg:#05161d;color-scheme:dark}
:root[data-theme="sakura"]{--ac2:#ff86ad;--bg:#2a1030;--sky1:#220c2c;--sky2:#4a1d4f;--sky3:#9b3f66;--neb1:rgba(255,160,200,.30);--neb2:rgba(255,200,140,.18);--fg:#fff0f5;--mu:#e6bdd0;--cd:rgba(50,16,52,.5);--cd2:rgba(110,40,90,.55);--bd:rgba(255,190,215,.32);--ac:#ffb7c9;--acf:#3a0f22;--starlit:#ffd9e6;--stargold:#ffe08a;--staroff:rgba(255,200,225,.5);--cline:rgba(255,220,235,.85);--moonlit:#fff4dd;--moondark:#5a2552;--glow:rgba(255,230,200,.45);--nav:rgba(40,12,44,.94);--tbg:#fff0f5;--tfg:#2a1030;color-scheme:dark}
:root[data-theme="forest"]{--ac2:#8fd14f;--bg:#06170f;--sky1:#04130c;--sky2:#0b2618;--sky3:#143a27;--neb1:rgba(120,200,110,.22);--neb2:rgba(60,160,140,.2);--fg:#eefae8;--mu:#aecaa8;--cd:rgba(8,36,22,.55);--cd2:rgba(22,70,44,.6);--bd:rgba(170,230,150,.28);--ac:#b6e36a;--acf:#10200a;--starlit:#e1f8b4;--stargold:#fde68a;--staroff:rgba(190,235,160,.5);--cline:rgba(215,250,170,.85);--nav:rgba(5,24,15,.94);--tbg:#eefae8;--tfg:#06170f;color-scheme:dark}
:root[data-theme="ocean"]{--ac2:#4aa8ff;--bg:#03203d;--sky1:#03142b;--sky2:#06335c;--sky3:#0a6a92;--neb1:rgba(110,220,255,.26);--neb2:rgba(80,140,255,.2);--fg:#e9f9ff;--mu:#a5d0e4;--cd:rgba(4,36,70,.5);--cd2:rgba(10,80,120,.55);--bd:rgba(130,215,255,.3);--ac:#6fe3ff;--acf:#022030;--starlit:#c6f0ff;--stargold:#fde68a;--staroff:rgba(170,230,255,.5);--cline:rgba(200,242,255,.85);--nav:rgba(3,22,44,.94);--tbg:#e9f9ff;--tfg:#03203d;color-scheme:dark}
body.full #planet{display:none}

/* ================= v5: tampilan lebih menarik ================= */
:root{--r:20px}
#app{padding:16px 16px 118px}
body.full #app{padding-bottom:176px}
#app.ani>*{animation:up .45s cubic-bezier(.2,.7,.2,1) both}
#app.ani>*:nth-child(2){animation-delay:.04s}#app.ani>*:nth-child(3){animation-delay:.08s}#app.ani>*:nth-child(4){animation-delay:.12s}#app.ani>*:nth-child(5){animation-delay:.16s}#app.ani>*:nth-child(n+6){animation-delay:.2s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
html.calm #app.ani>*{animation:none}
html.lite #app.ani>*{animation:none}
@media (prefers-reduced-motion:reduce){#app.ani>*{animation:none}}
/* kartu kaca */
.c{border-radius:var(--r);background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,0) 55%),var(--cd);border:1px solid var(--bd);box-shadow:var(--shd),inset 0 1px 0 rgba(255,255,255,.10);-webkit-backdrop-filter:blur(10px) saturate(1.25);backdrop-filter:blur(10px) saturate(1.25);padding:16px}
html.calm .c{-webkit-backdrop-filter:none;backdrop-filter:none}
html.lite .c{-webkit-backdrop-filter:none;backdrop-filter:none}
.c.lk:active,.op:active,.b:active,.rb:active,.ib:active{transform:scale(.98)}
.c.lk,.op,.b,.rb,.ib{transition:transform .12s ease}
/* hero */
.hero{padding:10px 90px 6px 0}
h1{font-size:42px;line-height:1.05;background:linear-gradient(95deg,var(--fg) 30%,var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.eyebrow{display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:18px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--ac),transparent)}
h2{font-size:34px;background:linear-gradient(95deg,var(--fg) 40%,var(--ac));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
h3{display:flex;align-items:center;gap:8px;margin:22px 2px 8px}
h3::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--ac)}
/* target ring */
.goal{gap:18px}
.ring{position:relative;width:96px;height:96px}
.ring>svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;line-height:0}
.rtk{fill:none;stroke:var(--staroff);stroke-width:5;opacity:.5}
.rpg{fill:none;stroke:var(--ac);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 5px var(--ac));transition:stroke-dasharray .8s ease}
.goal .n{font-size:42px}
.chip{background:rgba(255,255,255,.05);border-radius:999px}
/* kotak angka */
.tiles .c{position:relative;overflow:hidden;padding:16px 14px 14px}
.tiles .c::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--tc,var(--ac));opacity:.9}
.tiles .c::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--tc,var(--ac));opacity:.12;filter:blur(2px)}
.t1{--tc:var(--starlit)}.t2{--tc:var(--ok2)}.t3{--tc:var(--ok)}.t4{--tc:var(--bad)}
.tiles .n{color:var(--fg)}
/* tombol */
.b{border-radius:16px;padding:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 10px 24px -10px var(--ac),inset 0 1px 0 rgba(255,255,255,.35);letter-spacing:.01em}
.b.s{background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.02)),var(--cd2);color:var(--fg);box-shadow:none;border:1px solid var(--bd)}
.b.dn{background:var(--bad)}
.b .bn{background:rgba(0,0,0,.28);color:#fff}
.pg{height:8px}
.pg i{background:linear-gradient(90deg,var(--ac2),var(--ac));box-shadow:0 0 10px -1px var(--ac)}
.stk{height:18px}
.tabs button{backdrop-filter:blur(6px)}
.tabs button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 16px -6px var(--ac)}
.seg button.on{background:linear-gradient(135deg,var(--ac),var(--ac2))}
.op{border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,0)),var(--cd);box-shadow:var(--shd);padding:16px 16px 16px 18px;position:relative;border-left:3px solid var(--ac)}
.op::after{content:"›";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:26px;color:var(--ac);line-height:1}
.op.ok::after,.op.no::after{content:""}
.op b{font-size:17px}
input,select,textarea{border-radius:14px;background:var(--cd2)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
/* kartu belajar */
.fc{border-radius:26px;min-height:270px;padding:40px 18px 30px;box-shadow:0 0 0 1px var(--bd),0 24px 60px -24px var(--ac),var(--shd)}
.jp{font-size:52px;text-shadow:0 0 28px var(--glow)}
.mean{font-size:34px}
.sep{background:linear-gradient(90deg,transparent,var(--ac),transparent);height:1px;opacity:.6}
.rb{border-radius:16px;padding:12px 2px;border-bottom-width:4px}
.r-lupa{background:rgba(251,113,133,.16)}.r-sulit{background:rgba(251,191,36,.14)}.r-ingat{background:rgba(110,231,183,.14)}.r-mudah{background:rgba(103,232,249,.14)}
.act{background:linear-gradient(180deg,transparent,var(--nav) 30%);border-top:0;backdrop-filter:blur(8px);padding-top:18px}
/* menu bawah melayang */
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:24px;border:1px solid var(--bd);padding:6px;gap:2px;background:var(--nav);box-shadow:0 14px 36px -10px rgba(0,0,0,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);max-width:616px;margin:0 auto}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border-radius:18px;font-size:11px}
nav button.on{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));color:var(--ac)}
nav button.on::before{display:none}
nav button.on svg{filter:drop-shadow(0 0 6px var(--ac))}
#t{bottom:96px;border-radius:14px;box-shadow:var(--shd)}
.r{padding:11px 0}
.cg .c{padding:14px 10px}
.hb .ht,.hb .ht i{height:12px;border-radius:6px}

/* ================= v6: Galaxy Edition ================= */
:root[data-theme="cosmos"]{--sky1:#04061f;--sky2:#0a0d3a;--sky3:#1b0f52;--neb1:rgba(120,95,255,.38);--neb2:rgba(40,150,255,.22);
--cd:rgba(12,16,62,.62);--cd2:rgba(34,44,120,.6);--bd:rgba(112,130,255,.42);--ac:#6f7dff;--ac2:#4656f0;--acf:#fff;--ok2:#2de1d3;--ok:#34d399;
--shd:0 0 24px -6px rgba(90,110,255,.5);--nav:rgba(8,11,46,.88);--cline:rgba(190,205,255,.85);--staroff:rgba(165,180,255,.5)}
:root[data-theme="cosmos"] .pg i{background:linear-gradient(90deg,#2de1d3,#5b6cff);box-shadow:0 0 10px -1px #4da3ff}
:root[data-theme="cosmos"] .b{box-shadow:0 10px 26px -8px #5b6cff,inset 0 1px 0 rgba(255,255,255,.3)}
#skymoon,#planet{display:none}
body.v-map #skymoon{display:block;top:10px;right:14px}
#skymoon{transform:scale(.6);transform-origin:top right}
#sky .con{opacity:.7}
body.v-splash #skycon{display:none}
/* header halaman */
.hd{display:flex;align-items:center;gap:12px;margin:2px 0 16px}
.hd h2{flex:1;margin:0;font:700 22px/1.2 var(--fb);background:none;-webkit-text-fill-color:var(--fg);color:var(--fg)}
.hd .hr{display:flex;align-items:center;gap:8px;color:var(--mu)}
.bk{width:40px;height:40px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.hi{display:flex;width:40px;height:40px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);align-items:center;justify-content:center;color:var(--ac)}
/* segmen */
.sg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border:1px solid var(--bd);background:var(--cd);border-radius:16px;margin:4px 0 12px}
.sg button{border:0;background:none;color:var(--mu);padding:10px 4px;border-radius:12px;font:600 14px var(--fb);cursor:pointer}
.sg button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--acf);box-shadow:0 6px 16px -6px var(--ac)}
/* beranda */
.prof{display:flex;align-items:center;gap:14px;margin:4px 0 8px}
.av{flex:0 0 52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:radial-gradient(circle at 30% 25%,#8b7bff,#3a46d8 70%);border:2px solid rgba(190,200,255,.6);box-shadow:0 0 18px -2px var(--ac)}
.av.big{flex-basis:68px;height:68px}
.pi{flex:1;min-width:0}
.pn{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.pn b{font-size:18px}.lv{color:var(--ac);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.xp{margin-left:auto;font-size:12px;color:var(--mu);white-space:nowrap}
.quote{margin:0 2px 12px;font-style:italic;color:var(--mu);font-size:14px}
.tot{display:flex;justify-content:space-between;gap:12px;align-items:center}
.big2{font:700 44px/1.05 var(--fb);font-variant-numeric:tabular-nums}
.leg2{display:grid;gap:6px;min-width:128px}
.leg2>div,.leg3>div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:14px}
.leg2 i,.leg3 i{width:10px;height:10px;border-radius:50%}
.leg2 b,.leg3 b{font-variant-numeric:tabular-nums}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.tile{border:1px solid var(--bd);background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,0) 60%),var(--cd);box-shadow:var(--shd);border-radius:20px;padding:14px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--fg);font:600 13px var(--fb);cursor:pointer}
.ti2{position:relative;width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:var(--tc,var(--ac));background:color-mix(in srgb,var(--tc,var(--ac)) 18%,transparent);border:1px solid color-mix(in srgb,var(--tc,var(--ac)) 45%,transparent)}
.nb{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font:700 11px/20px var(--fb);text-align:center;padding:0 5px;font-style:normal}
.r2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
/* baris menu */
.row,.row2>summary{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--bd);background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,0) 60%),var(--cd);box-shadow:var(--shd);border-radius:18px;padding:12px 14px;margin:8px 0;color:var(--fg);cursor:pointer;list-style:none}
.row2>summary::-webkit-details-marker{display:none}
.row2{margin:8px 0}.row2>summary{margin:0}
.row2[open]>summary svg:last-child{transform:rotate(90deg)}
.ri{flex:0 0 42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--tc,var(--ac));background:color-mix(in srgb,var(--tc,var(--ac)) 16%,transparent);border:1px solid color-mix(in srgb,var(--tc,var(--ac)) 40%,transparent)}
.rt2{flex:1;min-width:0;display:flex;flex-direction:column}
.rt2 b{font-size:16px}.rt2 small{color:var(--mu);font-size:13px}
.row>svg:last-child,.row2>summary>svg:last-child{color:var(--mu);flex:0 0 auto}
.gb{padding:12px 4px 4px}
.gb p{margin:6px 0}
/* review */
.r3{display:flex;justify-content:space-around;text-align:center}
.er{color:var(--bad)}
.chs{display:flex;gap:8px;justify-content:space-between}
.chs button{flex:1;height:44px;border-radius:50%;max-width:48px;border:1px solid var(--bd);background:var(--cd2);color:var(--fg);font:700 14px var(--fb);cursor:pointer}
.chs button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--acf);box-shadow:0 0 16px -2px var(--ac)}
/* statistik */
.dn{display:flex;align-items:center;gap:16px}
.dw{position:relative;flex:0 0 130px;height:130px}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.dc b{font:700 28px var(--fb)}
.leg3{flex:1;display:grid;gap:8px}
.leg3>div{grid-template-columns:12px 1fr auto auto}.leg3 small{color:var(--mu);width:34px;text-align:right}
.av3 .n{font-size:30px}
.lvr{display:grid;grid-template-columns:34px 1fr 96px;gap:10px;align-items:center;padding:7px 0}
.lvn{font-weight:700;font-size:14px}.lvv{font-size:13px;text-align:right;white-space:nowrap}.lvv small{color:var(--mu)}
/* peta galaksi */
.gc{padding:6px;cursor:pointer}
.gal{display:block;width:100%;height:auto}
/* profil, pencapaian */
.pc{display:flex;gap:16px;align-items:center}
.ft{text-align:center}.fm{filter:drop-shadow(0 0 18px var(--stargold))}
.fm svg{width:92px!important;height:92px!important}
.rw{display:flex;gap:14px;align-items:center}
.cry{filter:drop-shadow(0 0 12px var(--ac))}
.dm{padding:0;overflow:hidden}.tor{display:block;width:100%;height:auto;background:linear-gradient(180deg,rgba(80,60,200,.35),transparent)}
.dt{padding:16px}
.gr{position:relative;display:inline-block;width:210px;height:210px}
.gr svg{display:block;transform:none}.gt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gt .n{font-size:40px}
/* game */
.gg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.gt2{border:1px solid var(--bd);background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,0) 60%),var(--cd);box-shadow:var(--shd);border-radius:20px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--fg);cursor:pointer;min-height:132px;justify-content:center}
.gt2 small{color:var(--mu)}.gt2 .ti2{width:56px;height:56px;border-radius:18px}
.hs{display:flex;align-items:center;gap:12px;color:var(--stargold)}.hs span{flex:1;color:var(--fg);font-weight:600}.hs b{font:700 22px var(--fb);color:var(--stargold)}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:1;border:1px solid var(--bd);background:var(--cd2);color:var(--ac);border-radius:14px;font:600 12px/1.15 var(--fb);padding:4px;display:flex;align-items:center;justify-content:center;text-align:center;word-break:break-word;cursor:pointer}
.mc.jj{font:600 15px var(--fj)}
.mc.ok{border-color:var(--ok);color:var(--fg);opacity:.5;pointer-events:none}.mc.no{border-color:var(--bad);background:rgba(251,113,133,.25)}
.mc:not(.ok):not(.no){color:var(--fg)}
/* AI */
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.bub{display:flex;gap:10px;max-width:92%;padding:12px 14px;border-radius:18px;font-size:15px;line-height:1.45;border:1px solid var(--bd)}
.bub.a{background:var(--cd);align-self:flex-start;border-top-left-radius:6px}.bub.u{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--acf);align-self:flex-end;border-top-right-radius:6px;border-color:transparent}
.bi{flex:0 0 auto;color:var(--ac)}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.sugs button{border:1px solid var(--bd);background:var(--cd);color:var(--ac);border-radius:999px;padding:8px 14px;font:500 13px var(--fb);cursor:pointer}
.sr{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);background:var(--cd);border-radius:14px;padding:0 12px;margin:4px 0 10px}
.sr input{border:0;background:none;margin:0;padding:12px 0}.sr svg{color:var(--mu);flex:0 0 auto}
.send{border:0;border-radius:12px;width:38px;height:38px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--acf);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
/* daftar kata */
.wr{display:flex;align-items:center;gap:12px;padding:12px;margin:8px 0;border:1px solid var(--bd);border-radius:16px;background:var(--cd);cursor:pointer}
.wi{flex:0 0 38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.wi.hafal{background:#16a36a}.wi.lupa{background:#e0425a}.wi.baru{background:#3b6cf0}.wi.belajar{background:#d4930a}
.wt{flex:1;min-width:0;display:flex;flex-direction:column}.wj{font:600 18px var(--fj)}
.wtag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid}
.wtag.hafal{color:var(--ok);border-color:var(--ok)}.wtag.lupa{color:var(--bad);border-color:var(--bad)}.wtag.baru{color:var(--ok2);border-color:var(--ok2)}.wtag.belajar{color:var(--hd);border-color:var(--hd)}
/* impor, form */
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:28px 16px;border:2px dashed var(--bd);border-radius:20px;background:var(--cd);color:var(--ac);cursor:pointer;text-align:center;margin:10px 0}
.drop b{color:var(--fg);font-size:17px}
.fe{display:flex;gap:10px;align-items:center;padding:12px 14px;margin:6px 0}.fe svg{color:var(--ok)}
/* tata bahasa */
.gd{border:1px solid var(--bd);border-radius:16px;background:var(--cd);margin:8px 0;overflow:hidden}
.gd>summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none}
.gd>summary::-webkit-details-marker{display:none}
.gn{flex:0 0 26px;color:var(--mu);font-variant-numeric:tabular-nums}
.gd summary b{flex:1}
.ck2{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);background:none;color:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ck2.on{background:var(--ok);border-color:var(--ok);color:#06231a}
.gd .gb{padding:0 14px 12px}
.ex{padding:8px 0;border-top:1px solid var(--bd)}.jpx{font:600 18px var(--fj)}
/* kartu belajar */
.lvb{position:absolute;left:14px;top:14px;padding:3px 10px;border-radius:999px;font:700 12px var(--fb);color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 0 12px -2px var(--ac)}
.fc{position:relative}
/* splash */
.spl{position:fixed;inset:0;z-index:2;overflow:hidden;display:flex;flex-direction:column}
.spt{position:relative;z-index:2;padding:11vh 28px 0}
.logo{margin:0;font:italic 400 64px/.95 var(--fd);color:#fff;text-shadow:0 0 28px rgba(140,150,255,.8);background:none;-webkit-text-fill-color:#fff}
.logo span{display:inline-block;margin-left:24px}
.tag2{margin:18px 0 0;font-size:15px;line-height:1.5;color:#cfd6ff}
.spc{position:absolute;right:6%;top:6%;width:min(40vw,170px);opacity:.9}
.spc2{position:absolute;left:4%;top:3%;width:60%;opacity:.9}
.hill{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;z-index:1}
.spb{position:relative;z-index:3;margin-top:auto;padding:0 28px 32px;text-align:center}
.spb .b{border-radius:999px;max-width:340px;margin:0 auto 18px}
.ed{color:#aab4ff;letter-spacing:.06em;line-height:1.6}
body.v-splash #nav{display:none}
/* misc */
.tabs2{display:none}
.hd+.sg{margin-top:0}
.c.dn .dc small{color:var(--mu)}

/* ================= v7: polesan tampilan neon + musik ================= */
:root[data-theme="cosmos"] .c,:root[data-theme="cosmos"] .tile,:root[data-theme="cosmos"] .row,:root[data-theme="cosmos"] .row2>summary,:root[data-theme="cosmos"] .gt2,:root[data-theme="cosmos"] .wr,:root[data-theme="cosmos"] .gd,:root[data-theme="cosmos"] .op{border-color:rgba(125,145,255,.55);box-shadow:0 0 0 1px rgba(110,130,255,.18),0 0 26px -6px rgba(90,110,255,.65),inset 0 0 26px rgba(70,90,255,.12)}
:root[data-theme="cosmos"] nav{border-color:rgba(125,145,255,.5);box-shadow:0 0 28px -6px rgba(90,110,255,.7),0 14px 36px -10px rgba(0,0,0,.6)}
/* ikon tile berwarna penuh */
.ti2{color:#fff;background:linear-gradient(150deg,color-mix(in srgb,var(--tc,var(--ac)) 92%,#fff),color-mix(in srgb,var(--tc,var(--ac)) 55%,#12104a));border:1px solid color-mix(in srgb,var(--tc,var(--ac)) 70%,#fff);box-shadow:0 0 18px -2px var(--tc,var(--ac)),inset 0 1px 0 rgba(255,255,255,.4);width:50px;height:50px;border-radius:16px}
.ri{color:#fff;background:linear-gradient(150deg,color-mix(in srgb,var(--tc,var(--ac)) 90%,#fff),color-mix(in srgb,var(--tc,var(--ac)) 55%,#12104a));border:1px solid color-mix(in srgb,var(--tc,var(--ac)) 65%,#fff);box-shadow:0 0 14px -3px var(--tc,var(--ac))}
.tile{padding:14px 4px 12px;gap:6px}
.tile .tl{font-size:14px;font-weight:700}
.tile small{color:var(--mu);font:500 11px/1.2 var(--fb);text-align:center;padding:0 4px}
/* saran hari ini */
.hint{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,rgba(80,100,255,.35),rgba(45,225,211,.14)),var(--cd)}
.hint b{font-size:15px;line-height:1.35;font-weight:600}

/* ================= v4: latihan baru, lencana, statistik mudah, tema ================= */
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const lng=s=>norm(s).replace(/ou|oo/g,'o').replace(/uu/g,'u').replace(/aa/g,'a').replace(/ii/g,'i').replace(/ee|ei/g,'e');
const meParts=me=>String(me||'').toLowerCase().split(/[,;\/()]|\batau\b/).map(norm).filter(x=>x);
function typeOk(c,inp){const n=norm(inp);if(!n)return false;
 if(String(c.ro||'').split(/[\/,;]/).some(r=>norm(r)&&lng(r)==lng(inp)))return true;
 if(norm(c.ro)&&lng(c.ro)==lng(inp))return true;
 if(norm(c.me)==n)return true;
 return meParts(c.me).some(p=>p==n||(n.length>=4&&p.includes(n)&&n.length>=p.length*.6))}
function logPrac(m,n,ok){D.prac.push({at:Date.now(),m,n,ok});if(D.prac.length>500)D.prac.shift();save()}
const sh=a=>a.slice().sort(()=>Math.random()-.5);
function barTop(p,txt){return`<div class="top"><div class="pg"><i style="width:${p}%"></i></div><span class="m">${txt}</span></div>`}

/* ---------- Ketik jawaban ---------- */
let T=null;
function startType(){let pool=D.cards.filter(c=>due(c)&&fb(c)).concat(D.cards.filter(c=>!learned(c)&&fb(c)).slice(0,newLeft()));
 if(!pool.length)pool=D.cards.filter(c=>learned(c)&&fb(c)).sort((a,b)=>sc(a)-sc(b));
 pool=sh(pool.slice(0,20));if(!pool.length){toast('Belum ada kartu untuk dilatih.');return}
 S=null;QZ=null;MT=null;TM=null;T={q:pool.map(c=>c.id),i:0,ok:0,no:0,chk:null,val:'',wrong:[],stars0:starInfo().lit};lockWL();render()}
function typeCheck(){const t=T,c=cardById(t.q[t.i]);if(!c||t.chk)return;if(!norm(t.val)){toast('Ketik jawabanmu dulu, atau tekan Tidak tahu.');return}t.chk=typeOk(c,t.val)?'ok':'no';render(1)}
function typeSkip(){T.val='';T.chk='no';render(1)}
function typeNext(fix){const t=T,c=cardById(t.q[t.i]),good=fix||t.chk=='ok';
 if(c){rate(c,good?'ingat':'lupa');if(good)t.ok++;else{t.no++;t.wrong.push(c)}}
 t.i++;t.chk=null;t.val='';render()}
function typeView(){const t=T;
 if(t.i>=t.q.length){if(!t.logged){t.logged=1;relWL();logPrac('ketik',t.ok+t.no,t.ok);badgeCheck()}
  const a=pctOf(t.ok,t.ok+t.no),gain=starInfo().lit-t.stars0;
  return`<h2>Latihan selesai</h2><div class="c"><div class="n">${t.ok} <small>/ ${t.ok+t.no} benar · ${a==null?'-':a+'%'}</small></div><div class="m">Hasilnya sudah ikut mengatur jadwal review.</div>${scoreLine()}</div>`+
  (gain>0?`<div class="c lk" onclick="ACT='sky';go('ach')">${ic('star',18)} <b>${gain} bintang baru menyala.</b></div>`:'')+
  (t.wrong.length?`<h3>Perlu diulang</h3><div class="c">${t.wrong.map(c=>`<div class="r"><span>${E(c.jp||c.ro)} <span class="m">${c.jp&&c.ro?E(c.ro):''}</span></span><b>${E(c.me)}</b></div>`).join('')}</div>`:'<div class="c">Semua benar. Bagus sekali.</div>')+
  `<div class="act"><div class="g"><button class="b s" onclick="go('home')" style="margin:0">Home</button><button class="b" onclick="startType()" style="margin:0">Lagi</button></div></div>`}
 const c=cardById(t.q[t.i]);if(!c){t.i++;return typeView()}
 const front=c.jp?`<div class="jp">${E(c.jp)}</div>`:`<div class="mean">${E(c.me)}</div>`,
 hint=c.jp&&c.ro?'Ketik romaji atau artinya':c.jp?'Ketik artinya':'Ketik romaji',
 body=t.chk?`<div class="res ${t.chk}">${t.chk=='ok'?'Benar':'Belum tepat'}</div>${c.ro?`<div class="ro">${E(c.ro)}</div>`:''}<div class="mean" style="font-size:26px">${E(c.me)}</div>${t.chk=='no'&&t.val?`<div class="m">Jawabanmu: ${E(t.val)}</div>`:''}${c.note?`<div class="note">Catatan: ${E(c.note)}</div>`:''}`
 :`<input id="ti" class="ti" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="${hint}" value="${E(t.val)}" oninput="T.val=this.value" onkeydown="if(event.key=='Enter')typeCheck()">`;
 const act=!t.chk?`<button class="b" onclick="typeCheck()">Periksa</button><button class="b s" style="margin-top:8px" onclick="typeSkip()">Tidak tahu</button>`
 :t.chk=='ok'?`<button class="b" onclick="typeNext()">Lanjut</button>`:`<div class="g"><button class="b s" style="margin:0" onclick="typeNext(1)">Aku benar (salah ketik)</button><button class="b" style="margin:0" onclick="typeNext()">Lanjut</button></div>`;
 return barTop(Math.round(t.i/t.q.length*100),(t.i+1)+' / '+t.q.length)+`<div class="tools"><span class="m" style="align-self:center">Ketik jawaban</span><button class="ib" onclick="go('study')">Keluar</button></div>
<div class="c fc">${front}<div class="sep"></div>${body}</div><div class="act"><div>${act}</div></div>`}

/* ---------- Cocokkan pasangan ---------- */
let MT=null;
function startMatch(){const pool=D.cards.filter(fb);if(pool.length<6){toast('Butuh minimal 6 kotoba.');return}
 const pick=sh(pool).slice(0,Math.min(18,Math.floor(pool.length/6)*6)),rounds=[];for(let i=0;i<pick.length;i+=6)rounds.push(pick.slice(i,i+6).map(c=>c.id));
 S=null;QZ=null;T=null;TM=null;MT={rounds,r:0,miss:0,t0:Date.now(),fin:0,bad:null};matchRound();lockWL();render()}
function matchRound(){const m=MT,ids=m.rounds[m.r];m.L=ids.slice();m.Rt=sh(ids);m.done=[];m.sel=null}
function matchTap(side,id){const m=MT;if(!m||m.bad||m.fin||m.done.includes(id))return;
 if(!m.sel||m.sel.side==side){m.sel={side,id};render(1);return}
 if(m.sel.id==id){m.done.push(id);m.sel=null;render(1);
  if(m.done.length==m.L.length)setTimeout(()=>{if(MT!==m)return;if(m.r+1<m.rounds.length){m.r++;matchRound()}else{m.fin=1;relWL();const n=m.rounds.flat().length;logPrac('cocok',n+m.miss,n);badgeCheck()}render()},450);
  return}
 m.miss++;m.bad=[m.sel,{side,id}];render(1);setTimeout(()=>{if(MT!==m)return;m.bad=null;m.sel=null;render(1)},550)}
function matchView(){const m=MT,tot=m.rounds.flat().length;
 if(m.fin){const secs=Math.max(1,Math.round((Date.now()-m.t0)/1000));return`<h2>Selesai</h2><div class="c"><div class="n">${fmtMin(secs)}</div><div class="m">${tot} pasangan · salah pilih ${m.miss} kali</div>${scoreLine()}</div><div class="act"><div class="g"><button class="b s" onclick="go('home')" style="margin:0">Home</button><button class="b" onclick="startMatch()" style="margin:0">Main lagi</button></div></div>`}
 const st=(side,id)=>m.done.includes(id)?' ok':m.bad&&m.bad.some(b=>b.side==side&&b.id==id)?' no':m.sel&&m.sel.side==side&&m.sel.id==id?' on':'';
 return barTop(Math.round((m.r*6+m.done.length)/tot*100),'Babak '+(m.r+1)+' / '+m.rounds.length)+`<div class="tools"><span class="m" style="align-self:center">Cocokkan pasangan</span><button class="ib" onclick="go('study')">Keluar</button></div><p class="m">Ketuk kata Jepang, lalu ketuk artinya.</p>
<div class="mtg"><div>${m.L.map(id=>{const c=cardById(id);return`<button class="mt${st('L',id)}" onclick="matchTap('L',${id})"><span class="jj">${E(c.jp||c.ro)}</span>${c.jp&&c.ro?`<small>${E(c.ro)}</small>`:''}</button>`}).join('')}</div><div>${m.Rt.map(id=>{const c=cardById(id);return`<button class="mt${st('R',id)}" onclick="matchTap('R',${id})">${E(c.me)}</button>`}).join('')}</div></div>`}

let TM=null,TMH=null;
function startT60(){const pool=D.cards.filter(fb);if(pool.length<4){toast('Butuh minimal 4 kotoba.');return}
 S=null;QZ=null;T=null;MT=null;TM={end:Date.now()+6e4,ok:0,no:0,pool,fin:0};t60Next();clearInterval(TMH);TMH=setInterval(t60Tick,250);lockWL();render()}
function t60Next(){const m=TM,c=m.pool[Math.floor(Math.random()*m.pool.length)],dir=Math.random()<.5?'jp':'id',
 oth=sh(m.pool.filter(x=>x.id!=c.id&&(dir=='jp'?x.me!=c.me:(x.jp||x.ro)!=(c.jp||c.ro)))).slice(0,3);m.cur={c,dir,opts:sh(oth.concat([c]))}}
function t60Pick(k){const m=TM;if(!m||m.fin)return;const it=m.cur;if(it.opts[k].id==it.c.id)m.ok++;else m.no++;t60Next();render(1)}
function t60Tick(){const m=TM;if(!m){clearInterval(TMH);return}const left=Math.max(0,m.end-Date.now());
 if(left<=0&&!m.fin){m.fin=1;clearInterval(TMH);relWL();logPrac('t60',m.ok+m.no,m.ok);const b=D.set.best60||0;m.nb=m.ok>b&&m.ok>0;if(m.nb){D.set.best60=m.ok;save()}badgeCheck();render();return}
 const v=$('#tmv'),b=$('#tmb');if(v)v.textContent=Math.ceil(left/1000);if(b)b.style.width=(left/600)+'%'}
function t60View(){const m=TM;
 if(m.fin)return`<h2>Waktu habis</h2><div class="c"><div class="n">${m.ok} <small>benar · ${m.no} salah</small></div><div class="m">${m.nb?'Rekor baru!':'Rekor kamu: '+(D.set.best60||0)+' benar'}</div>${scoreLine()}</div><div class="act"><div class="g"><button class="b s" onclick="go('home')" style="margin:0">Home</button><button class="b" onclick="startT60()" style="margin:0">Coba lagi</button></div></div>`;
 const it=m.cur,c=it.c,left=Math.max(0,m.end-Date.now());
 return`<div class="top"><div class="pg"><i id="tmb" style="width:${left/600}%"></i></div><span class="m"><b id="tmv" style="font-size:20px">${Math.ceil(left/1000)}</b> dtk</span></div><div class="tools"><span class="m" style="align-self:center">Benar ${m.ok} · Salah ${m.no}</span><button class="ib" onclick="go('study')">Keluar</button></div>
<div class="c fc" style="min-height:150px;padding:20px 12px">${it.dir=='jp'?`<div class="jp" style="font-size:38px">${E(c.jp||c.ro)}</div>${c.jp&&c.ro?`<div class="ro">${E(c.ro)}</div>`:''}`:`<div class="mean" style="font-size:28px">${E(c.me)}</div>`}</div>`+
 it.opts.map((o,k)=>`<button class="op" onclick="t60Pick(${k})">${it.dir=='jp'?E(o.me):E(o.jp||o.ro)+(o.jp&&o.ro?` <span class="m">${E(o.ro)}</span>`:'')}</button>`).join('')}

/* ---------- Tanya AI (salin pertanyaan) ---------- */
function askAI(id){const c=cardById(id);if(!c)return;
 const t=`Jelaskan kata bahasa Jepang "${c.jp||c.ro}"${c.jp&&c.ro?' ('+c.ro+')':''} yang artinya "${c.me}". Berikan: 1) cara baca dan arti, 2) tiga contoh kalimat sederhana (tulisan Jepang, romaji, dan arti Indonesia), 3) satu jembatan keledai supaya mudah diingat. Pakai bahasa Indonesia yang sederhana untuk pemula.`;
 const fb2=()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Pertanyaan disalin. Tempel di Claude atau ChatGPT.')}catch(e){toast('Gagal menyalin')}ta.remove()};
 try{navigator.clipboard.writeText(t).then(()=>toast('Pertanyaan disalin. Tempel di Claude atau ChatGPT.')).catch(fb2)}catch(e){fb2()}}

function stLat(){const P=D.prac||[],Q=D.quiz,rows=[['Kuis cepat',Q.filter(q=>!q.k).map(q=>[q.n,q.ok])],['Kuis dengar',Q.filter(q=>q.k=='ear').map(q=>[q.n,q.ok])],['Ketik jawaban',P.filter(x=>x.m=='ketik').map(x=>[x.n,x.ok])],['Cocokkan pasangan',P.filter(x=>x.m=='cocok').map(x=>[x.n,x.ok])],['Tantangan 60 detik',P.filter(x=>x.m=='t60').map(x=>[x.n,x.ok])],['Memory (pasangan / langkah)',P.filter(x=>x.m=='memori').map(x=>[x.n,x.ok])]];
 if(!P.length&&!Q.length)return empty('Belum ada latihan. Coba menu Belajar, bagian Latihan.');
 const L=[].concat(Q.map(q=>({at:q.at,t:q.k=='ear'?'Kuis dengar':'Kuis cepat',n:q.n,ok:q.ok})),P.map(x=>({at:x.at,t:({ketik:'Ketik jawaban',cocok:'Cocokkan pasangan',t60:'Tantangan 60 detik',memori:'Memory'})[x.m]||x.m,n:x.n,ok:x.ok}))).sort((a,b)=>b.at-a.at).slice(0,8);
 return`<div class="c"><p class="ct">Per jenis latihan</p><p class="cs">Jumlah sesi dan persen jawaban benar.</p><div class="tbw"><table class="tb"><tr><th></th><th>Sesi</th><th>Benar</th></tr>${rows.map(r=>{const n=r[1].reduce((a,x)=>a+x[0],0),ok=r[1].reduce((a,x)=>a+x[1],0);return`<tr><td>${r[0]}</td><td>${r[1].length}</td><td>${n?Math.round(100*ok/n)+'%':'–'}</td></tr>`}).join('')}</table></div>${D.set.best60?`<div class="r" style="margin-top:6px"><span>Rekor 60 detik</span><b>${D.set.best60} benar</b></div>`:''}</div>
<div class="c"><p class="ct">Terakhir</p>${L.map(x=>`<div class="r"><span>${x.t} <span class="m">${fd(x.at)}</span></span><b>${x.ok} / ${x.n}</b></div>`).join('')}</div>`}

function weekBlock(){const H=D.hist,m=dayCounts(),a0=dstart(6),b0=dstart(13),wk=H.filter(x=>x.at>=a0),pv=H.filter(x=>x.at>=b0&&x.at<a0);
 const days=n=>{let d=0;for(let i=0;i<7;i++)if(m[dstart(i+n)])d++;return d},d1=days(0),d2=days(7),a1=accOf(wk),a2=accOf(pv),n1=D.cards.filter(c=>c.first>=a0).length,n2=D.cards.filter(c=>c.first>=b0&&c.first<a0).length;
 const hard=D.cards.filter(c=>c.lp>0).sort((x,y)=>y.lp-x.lp)[0];
 let t=`Minggu ini kamu belajar ${d1} dari 7 hari dan menjawab ${wk.length} kartu`+(a1!=null?`, akurasi ${a1}%`:'')+'.';
 if(a1!=null&&a2!=null){const d=a1-a2;t+=d>0?` Akurasimu naik ${d} poin dari minggu lalu.`:d<0?` Akurasimu turun ${-d} poin dari minggu lalu.`:' Akurasimu sama dengan minggu lalu.'}
 if(hard)t+=` Kata yang paling sering kamu lupa: ${E(hard.jp||hard.ro)} (${E(hard.me)}), ${hard.lp} kali.`;
 const df=(a,b,suf)=>a==null||b==null?'–':a>b?`<span style="color:var(--ok)">▲ ${a-b}${suf||''}</span>`:a<b?`<span style="color:var(--bad)">▼ ${b-a}${suf||''}</span>`:'=';
 const cmp=`<div class="tbw"><table class="tb"><tr><th></th><th>Minggu ini</th><th>Minggu lalu</th><th>Selisih</th></tr><tr><td>Hari belajar</td><td>${d1}</td><td>${d2}</td><td>${df(d1,d2)}</td></tr><tr><td>Jawaban</td><td>${wk.length}</td><td>${pv.length}</td><td>${df(wk.length,pv.length)}</td></tr><tr><td>Kata baru</td><td>${n1}</td><td>${n2}</td><td>${df(n1,n2)}</td></tr><tr><td>Akurasi</td><td>${a1==null?'–':a1+'%'}</td><td>${a2==null?'–':a2+'%'}</td><td>${df(a1,a2,' poin')}</td></tr></table></div>`;
 const nw14=D.cards.filter(c=>c.first>=dstart(13)).length,rate=nw14/14,left=D.cards.filter(c=>!learned(c)).length;
 const fc=!left?'Semua kotoba sudah kamu pelajari.':rate>0?`Dua minggu terakhir kamu mempelajari ±${rate<1?rate.toFixed(1):Math.round(rate)} kata baru per hari. Sisa ${left} kata belum dipelajari, jadi semuanya selesai dipelajari sekitar <b>${fd(Date.now()+Math.ceil(left/rate)*DAY)}</b>. Supaya hafal, tetap ulang sesuai jadwal.`:`Belum ada kata baru yang dipelajari dalam dua minggu terakhir. Sisa ${left} kata belum dipelajari.`;
 const lv={};D.cards.forEach(c=>{const k=c.lv||'Tanpa level',o=lv[k]||(lv[k]={t:0,l:0,h:0});o.t++;if(learned(c))o.l++;if(c.rc&&sc(c)>=HAFAL)o.h++});
 const lvh=Object.keys(lv).sort().map(k=>{const o=lv[k];return`<div class="hb"><span class="hl">${E(k)}</span><span class="ht" style="position:relative"><i style="position:absolute;left:0;width:${Math.round(o.l/o.t*100)}%;background:var(--starlit);opacity:.5"></i><i style="position:absolute;left:0;width:${Math.round(o.h/o.t*100)}%;background:var(--stargold)"></i></span><span class="hv">${o.h} / ${o.t}</span></div>`}).join('');
 return`<div class="c"><p class="ct">Ringkasan minggu ini</p><p style="margin:6px 0 10px">${t}</p>${cmp}</div><div class="c"><p class="ct">Perkiraan selesai</p><p style="margin:6px 0 0">${fc}</p></div><div class="c"><p class="ct">Peta level</p><p class="cs">Bar emas = hafal, bar biru muda = sudah dipelajari. Angka: hafal / total.</p>${lvh}</div>`}

 return null}
const STOP=new Set(['kata','yang','apa','arti','ini','itu','dan','atau','dari','untuk','aku','saya','dengan','bisa','cara','buat','beda','bedanya','contoh','sering','lupa','sulit','susah','tes','kuis','mau','tolong','jelaskan','kalimat','dalam','bahasa','jepang','tanya','cek','kamu','ada','apakah','bagaimana','gimana','kenapa','sudah','berapa']);
function aiFind(q){const toks=(q.toLowerCase().match(/[a-z0-9]+/g)||[]),wins=new Set(),lw=new Set();
 for(let i=0;i<toks.length;i++){let s='';for(let k=0;k<3&&i+k<toks.length;k++){s+=toks[i+k];if(k==0&&STOP.has(toks[i]))continue;wins.add(norm(s));lw.add(lng(s))}}
 const hits=[];
 D.cards.forEach(c=>{let s=0;
  if(c.jp&&(c.jp.length>=2||/[\u4e00-\u9fff]/.test(c.jp))&&q.includes(c.jp))s=10+c.jp.length;
  String(c.ro||'').split(/[\/;,]/).forEach(r=>{const n=norm(r);if(n&&lw.has(lng(r)))s=Math.max(s,8+n.length)});
  meParts(c.me).forEach(p=>{if(p&&wins.has(p)&&!STOP.has(p))s=Math.max(s,6+p.length)});
  if(s)hits.push([s,c])});
 return hits.sort((a,b)=>b[0]-a[0]).slice(0,3).map(x=>x[1])}

function aiAnswer(q){q=q.trim();let m=aiCompare(q);if(m)return m;
 let T=aiTopic(q,false);if(T)return{h:'<b>'+T.t+'</b>'+T.h,acts:T.acts};
 const W=D.cards.length?aiFind(q):[];
 if(/kalimat|contoh/i.test(q)){const L=W.length?W:(aiWords(5).length?aiWords(5):D.cards.slice(0,5));
  if(!L.length)return{h:'Belum ada kata di daftarmu. Tambahkan kata dulu, lalu aku buatkan contoh kalimatnya.'};
  const rows=L.map(c=>{const s=aiSent(c);return s?'<div style="margin-top:8px"><b>'+E(c.jp||c.ro)+'</b> <span class="m">'+E(c.me)+'</span>'+s+'</div>':''}).join('');
  return{h:'<p>Contoh kalimat dengan pola dasar:</p>'+(rows||'<p>Kata-kata ini belum punya tulisan Jepang. Isi dulu lewat Edit kartu.</p>')+'<div class="m" style="margin-top:6px">Ini contoh otomatis dari pola dasar. Kalau katanya bukan benda atau kata kerja, sesuaikan polanya.</div>'}}
 if(W.length){const c=W[0];return{h:W.map(aiWordHtml).join(''),acts:[['Dengar',"sp("+c.id+")"],['Buka kartu',"CD="+c.id+";render()"]]}}
 if(/\b(kuis|quiz|tes|ujian|latihan|game)\b/i.test(q))return{h:'<p>Pilih latihannya:</p>',acts:[['Quiz cepat',"startQuiz()"],['Ketik jawaban',"startType()"],['Cocokkan',"startMatch()"],['Dengar',"startQuiz('ear',10,'sedang')"],['60 detik',"startT60()"]]};
 if(/lupa|lemah|sulit|susah|bandel|sering salah/i.test(q)){const L=aiWords(8);
  if(!L.length)return{h:'Belum ada kata yang tercatat sulit. Mulai belajar dulu, nanti kata yang sering kamu lupa muncul di sini.'};
  return{h:'<p>Kata yang paling perlu perhatian:</p>'+L.map(c=>'<div class="r lk" onclick="CD='+c.id+';render()"><span>'+E(c.jp||c.ro)+' · '+E(c.me)+'</span><b>'+(learned(c)?sc(c)+'/100':'Baru')+'</b></div>').join(''),acts:[['Latih kata sulit',"start('hard')"],['Kata bandel',"start('leech')"]]}}
 if(/progres|progress|statistik|kemajuan|capaian|streak|berapa/i.test(q)){const td=D.hist.filter(x=>x.at>=sod()).length,cc=catCounts(),st=streakInfo(dayCounts());
  return{h:'<p>Total '+D.cards.length+' kata: '+cc.h+' hafal, '+cc.m+' dalam proses, '+cc.l+' lemah, '+cc.b+' baru.</p><p>Hari ini '+td+' review (target '+(D.set.goal||30)+'). Beruntun '+st.cur+' hari, rekor '+st.best+'.</p>',acts:[['Lihat statistik',"go('stats')"]]}}
 T=aiTopic(q,true);if(T)return{h:'<b>'+T.t+'</b>'+T.h,acts:T.acts};
 return{h:'<p>Aku belum menemukan jawabannya di daftar katamu atau materi bawaan. Coba tulis kata dari daftarmu, nama partikel (は, を, に ...), atau topik seperti bentuk て, kata sifat, salam, angka. Untuk pertanyaan bebas, pakai tombol di bawah.</p>',ext:true}}

const mf=m=>440*Math.pow(2,(m-69)/12);
const TRACKS=[
 {id:'nebula',n:'Nebula Drift',d:'Pad lembut dan tenang, cocok untuk fokus',bpm:54,ch:[[57,60,64,69],[53,60,65,69],[55,60,64,67],[55,59,62,67]],sc:[69,72,74,76,79,81],mode:'spark'},
 {id:'orbit',n:'Orbit Tenang',d:'Petikan pelan yang berputar, seperti mengorbit bintang',bpm:66,ch:[[50,57,62,65],[46,53,58,62],[48,55,60,64],[45,52,57,60]],sc:[],mode:'arp'},
 {id:'aurora',n:'Fajar Aurora',d:'Hangat dan terang, seperti cahaya aurora',bpm:60,ch:[[62,66,69,74],[57,64,69,73],[59,66,71,74],[55,62,67,71]],sc:[74,76,78,81,83],mode:'mel'}];
const MUS={ctx:null,out:null,bus:null,dl:null,t:0,on:false,h:null,nx:0,st:0,vol:1,k:2};
function applyLite(){try{document.documentElement.classList.toggle('lite',!!(D.set.lite||MUS.on))}catch(e){}}
function musInit(){if(MUS.ctx)return true;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)throw 0;let c;try{c=new C({latencyHint:'playback'})}catch(e){c=new C()}MUS.ctx=c;
 const out=c.createGain();out.gain.value=MUS.vol*MUS.k;const cp=c.createDynamicsCompressor();cp.threshold.value=-10;cp.knee.value=6;cp.ratio.value=20;cp.attack.value=.003;cp.release.value=.25;
 out.connect(cp);cp.connect(c.destination);MUS.out=out;return true}catch(e){MUS.ctx=null;toast('Musik tidak didukung di perangkat ini.');return false}}
function musBus(){const c=MUS.ctx,bus=c.createGain();bus.gain.value=0;bus.connect(MUS.out);MUS.bus=bus;return bus}
function mv(f,t,dur,o){const c=MUS.ctx,bus=MUS.bus;if(!bus)return;const osc=c.createOscillator(),g=c.createGain();osc.type=o.type;osc.frequency.value=f;osc.connect(g);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(o.v,t+o.a);g.gain.setValueAtTime(o.v,t+Math.max(o.a,dur-o.r));g.gain.linearRampToValueAtTime(0,t+dur);
 g.connect(bus);let s=null;if(o.dl){s=c.createGain();s.gain.value=o.dl;g.connect(s);s.connect(MUS.dl)}
 osc.onended=()=>{try{g.disconnect();if(s)s.disconnect()}catch(e){}};osc.start(t);osc.stop(t+dur+.05)}
function bell(f,t,v,d){d=d||2.4;mv(f,t,d,{type:'sine',v:v,a:.008,r:d-.1});mv(f*2,t,d/2,{type:'sine',v:v*.22,a:.008,r:d/2-.1})}
function musTick(){if(!MUS.on||!MUS.bus)return;const c=MUS.ctx,tr=TRACKS[MUS.t],beat=60/tr.bpm;if(MUS.nx<c.currentTime)MUS.nx=c.currentTime+.05;
 while(MUS.nx<c.currentTime+3){const t=MUS.nx,s=MUS.st,bar=Math.floor(s/4),pos=s%4,ch=tr.ch[bar%tr.ch.length].map(n=>n<53?n+12:n);
  if(pos==0)ch.forEach(n=>mv(mf(n),t,beat*4+1.2,{type:'sine',v:.13,a:1.4,r:2}));
  if(tr.mode=='spark'&&Math.random()<.55)bell(mf(tr.sc[Math.floor(Math.random()*tr.sc.length)]),t+(Math.random()<.5?0:beat/2),.2);
  if(tr.mode=='arp')[0,1].forEach(k=>bell(mf(ch[(pos*2+k)%4]),t+k*beat/2,.17,1.5));
  if(tr.mode=='mel'&&(pos==0||pos==2)&&Math.random()<.85)bell(mf(tr.sc[(pos+bar*2)%tr.sc.length]),t,.2);
  MUS.nx+=beat;MUS.st++}}
function musKill(){const c=MUS.ctx;if(!c||!MUS.bus)return;const b=MUS.bus;MUS.bus=null;clearInterval(MUS.h);try{b.gain.cancelScheduledValues(c.currentTime);b.gain.setValueAtTime(b.gain.value,c.currentTime);b.gain.linearRampToValueAtTime(0,c.currentTime+.5)}catch(e){}setTimeout(()=>{try{b.disconnect()}catch(e){}},700)}
function musPlay(i){if(!musInit())return;const c=MUS.ctx;if(i!=null)MUS.t=i;musKill();
 const run=()=>{const b=musBus();MUS.on=true;MUS.nx=c.currentTime+.15;MUS.st=0;b.gain.setValueAtTime(0,c.currentTime);b.gain.linearRampToValueAtTime(1,c.currentTime+1.5);MUS.out.gain.value=MUS.vol*MUS.k;MUS.h=setInterval(musTick,700);musTick();applyLite();D.set.mt=MUS.t;save();render(1)};
 if(c.state!=='running')c.resume().then(run).catch(run);else run()}
function musStop(){const c=MUS.ctx;if(!c)return;MUS.on=false;musKill();applyLite();setTimeout(()=>{if(!MUS.on)try{c.suspend()}catch(e){}},900);render(1)}
function musToggle(){if(MUS.on)musStop();else musPlay(D.set.mt||0)}
function musPick(i){if(MUS.on&&MUS.t==i){musStop();return}musPlay(i)}
function musStep(d){const i=((MUS.on?MUS.t:(D.set.mt||0))+d+TRACKS.length)%TRACKS.length;if(MUS.on)musPlay(i);else{MUS.t=i;D.set.mt=i;save();render(1)}}

<div class="eq">${[0,1,2,3,4].map(i=>`<i style="animation-delay:${i*.15}s"></i>`).join('')}</div><b style="font-size:22px">${t.n}</b><div class="m" style="margin:4px 0 14px">${t.d}</div>
